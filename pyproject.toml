[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genshen-skin-cp3"
version = "0.1.0"
description = "原神 CP 壁纸套件 3 —— 奥黛塔 x 沃雅妮莎: 单张样式一键切换壁纸、桌面桌宠、多 IDE 皮肤 (VSCode/Trae/CodeX/JetBrains/Harness/ClaudeCode/KimiCode/DeepKing)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Mr.Water", email = "wph666@users.noreply.github.com" }]
keywords = [
    "genshin",
    "wallpaper",
    "skin",
    "desktop-pet",
    "ide-theme",
    "mcp",
    "deepking",
    "vscode",
    "jetbrains",
    "奥黛塔",
    "沃雅妮莎",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Graphics",
    "Natural Language :: Chinese (Simplified)",
]
dependencies = ["pillow>=9.0"]

[project.optional-dependencies]
dev = ["build>=1.0", "twine>=4.0"]

[project.urls]
Homepage = "https://github.com/WPH666-py/Genshen-skin-CP3"
Repository = "https://github.com/WPH666-py/Genshen-skin-CP3"
Source = "https://github.com/WPH666-py/Genshen-skin-CP3"
"Bug Tracker" = "https://github.com/WPH666-py/Genshen-skin-CP3/issues"
"姊妹套件 CP1" = "https://github.com/WPH666-py/Genshen-Skin-CP1"

[project.scripts]
genshen-cp3 = "genshen_skin_cp3.engine.cli:main"
genshen-cp3-pet = "genshen_skin_cp3.engine.pet:main"
genshen-cp3-switcher = "genshen_skin_cp3.engine.switcher:main"
genshen-cp3-mcp = "genshen_skin_cp3.engine.mcp_server:main"
genshen-cp3-install = "genshen_skin_cp3.engine.autoinstall:main"
genshen-cp3-deepking = "genshen_skin_cp3.engine.deepking_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genshen_skin_cp3 = ["engine/assets/*.jpg", "engine/assets/*.txt", "skin.json"]
